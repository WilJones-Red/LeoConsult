name: Sync Calendly Leads

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call Calendly Sync Function
        run: |
          curl -X POST \
            https://clpcskkoguomoihnisai.supabase.co/functions/v1/calendly-sync \
            -H "Content-Type: application/json" \
            --fail-with-body
